<!DOCTYPE html>
<html lang="ht">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<title>Aimbot Lab — Android</title>
<style>
:root{
  --bg:#05080d; --pnl:#0b1220ee; --br:#12304a; --fg:#cfe9ff; --acc:#22d3ee;
  --ok:#3fb950; --er:#f85149; --warn:#f0b429;
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font:13px/1.4 ui-monospace,"Roboto Mono",monospace;overscroll-behavior:none}
body{touch-action:none;user-select:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;display:block}
svg.i.sm{width:16px;height:16px;stroke-width:2.1}

#stage{position:fixed;inset:0;background:#000}
#game{position:absolute;inset:0;width:100%;height:100%;border:0}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

#topbar{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;
  gap:8px;padding:0 12px;background:linear-gradient(#000d,#0000);z-index:20;
  font-size:11px;color:#8fb8d8;pointer-events:none}
#topbar b{color:var(--acc);letter-spacing:.08em}
.pill{font-size:10px;padding:3px 9px;border-radius:99px;border:1px solid var(--br);color:#7d97ad}

#quick{position:fixed;right:12px;bottom:calc(14px + var(--sb));display:flex;
  flex-direction:column;gap:12px;z-index:25}
.tbtn{width:76px;height:76px;border-radius:50%;border:2px solid var(--br);background:#0b1220e6;
  color:#7d97ad;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;transition:.12s;backdrop-filter:blur(6px)}
.tbtn .st{font-size:9px;font-weight:700;letter-spacing:.6px;opacity:.9}
.tbtn.on{border-color:var(--ok);color:#d7ffe4;box-shadow:0 0 16px #3fb95088,inset 0 0 18px #3fb95026}
.tbtn:active{transform:scale(.93)}
#btnAim.on{border-color:var(--er);color:#ffe0df;box-shadow:0 0 18px #f8514988,inset 0 0 18px #f8514926}
#btnEsp.on{border-color:var(--acc);color:#d6f8ff;box-shadow:0 0 18px #22d3ee88,inset 0 0 18px #22d3ee26}
#btnMenu{width:50px;height:50px;align-self:flex-end}

#panel{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--pnl);
  backdrop-filter:blur(10px);border-top:1px solid var(--br);border-radius:14px 14px 0 0;
  transform:translateY(calc(100% - 48px));transition:transform .22s ease;
  max-height:80vh;display:flex;flex-direction:column}
#panel.open{transform:translateY(0)}
#grab{height:48px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px;
  border-bottom:1px solid var(--br)}
#grab .dot{width:38px;height:4px;border-radius:2px;background:#24435e;margin:0 auto}
#grab b{font-size:10px;color:var(--acc);letter-spacing:.12em}
#tabs{display:flex;gap:6px;padding:9px 11px;flex:0 0 auto}
#tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:10px 0;border-radius:9px;border:1px solid var(--br);background:#0b1220;
  color:#7d97ad;font:700 10.5px ui-monospace,monospace;letter-spacing:.04em}
#tabs button.active{background:#0e2a3d;border-color:var(--acc);color:var(--acc)}
#pages{overflow-y:auto;padding:0 12px calc(20px + var(--sb));-webkit-overflow-scrolling:touch}

fieldset{border:1px solid var(--br);border-radius:10px;margin:0 0 10px;padding:8px 11px 11px}
legend{color:var(--acc);padding:0 6px;font-size:10px;letter-spacing:.12em}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0;font-size:12px}
input[type=range]{width:50%;accent-color:var(--acc);height:28px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
input[type=text],input[type=number],select,textarea{
  background:#04080f;color:var(--fg);border:1px solid var(--br);border-radius:8px;
  padding:10px;font:inherit;width:100%;font-size:12px}
textarea{height:132px;resize:vertical;line-height:1.45}
button.act{background:var(--acc);color:#04202a;border:0;border-radius:9px;padding:12px;
  font:700 12px ui-monospace,monospace;width:100%;display:flex;align-items:center;
  justify-content:center;gap:8px}
button.act.ghost{background:#0e1a26;color:var(--fg);border:1px solid var(--br)}
button.act.danger{background:var(--er);color:#fff}
button.act:active{filter:brightness(1.18)}
.row{display:flex;gap:8px;margin-top:9px}.row>*{flex:1}
#files{max-height:170px;overflow-y:auto;border:1px solid var(--br);border-radius:9px;margin-top:9px}
#files div{display:flex;gap:8px;padding:10px;border-bottom:1px solid #0f1c29;font-size:11px}
#files div.sel{background:#0e2a3d;color:var(--acc);border-left:3px solid var(--acc)}
#log{height:98px;overflow-y:auto;background:#04080f;border:1px solid var(--br);
  border-radius:9px;padding:8px;font-size:10.5px;white-space:pre-wrap;margin-top:9px}
.ok{color:var(--ok)}.er{color:var(--er)}.warn{color:var(--warn)}
.hide{display:none}
</style>
</head>
<body>

<div id="stage">
  <iframe id="game" src="Build/index.html" allow="fullscreen; autoplay"></iframe>
  <canvas id="overlay"></canvas>

<div id="topbar">
  <b>■ AIMBOT LAB</b>
  <span id="stat" class="pill">ap tann jwèt…</span>

  <button class="tbtn" id="btnAim"><svg class="i"><use href="#i-target"/></svg><span class="st">OFF</span></button>

const A = window.__aimbot;
console.log('sib:', A ? A.targets().length : 'pa chaje');</textarea>

<script src="aimbot.js" id="aimbot-script"></script>
<script>
const $ = id => document.getElementById(id);
const gameEl = $('game'), overlay = $('overlay');
let pkg = null, selected = null;

function log(m, c=''){ const d=document.createElement('div'); d.className=c;
  d.textContent=m; $('log').appendChild(d); $('log').scrollTop=1e9; }

/* ─────────── ENGINE ─────────── */
let A = Aimbot.create({ getWindow: () => gameEl.contentWindow, overlay, onLog: log });
window.__aimbot = A;
A.start();

/* ─────────── Bouton ON/OFF ─────────── */
function paint(){
  $('btnAim').classList.toggle('on', A.cfg.aimbot.on);
  $('btnEsp').classList.toggle('on', A.cfg.esp.on);
  $('btnAim').querySelector('.st').textContent = A.cfg.aimbot.on ? 'ON' : 'OFF';
  $('btnEsp').querySelector('.st').textContent = A.cfg.esp.on ? 'ON' : 'OFF';
}
$('btnAim').onclick = () => { A.setAimbot(!A.cfg.aimbot.on); paint(); };
$('btnEsp').onclick = () => { A.setEsp(!A.cfg.esp.on); paint(); };
paint();

/* ─────────── Panel ─────────── */
$('grab').onclick = () => {
  $('panel').classList.toggle('open');
  $('grabIcon').style.transform = $('panel').classList.contains('open') ? 'rotate(180deg)' : '';
};
$('btnMenu').onclick = () => $('grab').onclick();
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  document.querySelectorAll('[data-page]').forEach(p =>
    p.classList.toggle('hide', p.dataset.page !== b.dataset.p));
});

/* ─────────── Reglaj → config ─────────── */
$('cMode').onchange   = e => A.configure({aimbot:{mode:e.target.value}});
$('cFov').oninput     = e => { $('vFov').textContent=e.target.value; A.configure({aimbot:{fov:+e.target.value}}); };
$('cSmooth').oninput  = e => { const v=e.target.value/100; $('vSmooth').textContent=v.toFixed(2); A.configure({aimbot:{smooth:v}}); };
$('cHead').oninput    = e => { const v=e.target.value/100; $('vHead').textContent=v.toFixed(2); A.configure({aimbot:{headRatio:v}}); };
$('cDist').oninput    = e => { $('vDist').textContent=e.target.value; A.configure({aimbot:{maxDist:+e.target.value}}); };
$('cAimKey').onchange = e => A.configure({aimbot:{aimKey:e.target.value}});
$('cHs').onchange     = e => A.configure({aimbot:{headshot:e.target.checked}});
$('cHum').onchange    = e => A.configure({aimbot:{humanize:e.target.checked}});

$('eBox').onchange    = e => A.configure({esp:{box:e.target.checked}});
$('eSnap').onchange   = e => A.configure({esp:{snap:e.target.checked}});
$('eName').onchange   = e => A.configure({esp:{name:e.target.checked}});
$('eDist').onchange   = e => A.configure({esp:{distance:e.target.checked}});
$('eHp').onchange     = e => A.configure({esp:{hp:e.target.checked}});
$('eHit').onchange    = e => A.configure({esp:{hitInfo:e.target.checked}});
$('eHolo').onchange   = e => A.configure({esp:{holo:e.target.checked}});
$('eFill').onchange   = e => A.configure({esp:{fill:e.target.checked}});
$('eMax').oninput     = e => { $('vEMax').textContent=e.target.value; A.configure({esp:{maxDist:+e.target.value}}); };
$('eScale').oninput   = e => A.configure({esp:{scale:+e.target.value||1}});
$('eColor').onchange  = e => A.configure({esp:{color:e.target.value}});

/* ─────────── Probe ─────────── */
$('btnProbe').onclick = () => {
  try{
    const w = gameEl.contentWindow;
    log('Module: ' + (!!w.Module) + ' | unityInstance: ' + (!!w.unityInstance), 'ok');
    if (w.Module) log('HEAPF32: ' + (w.Module.HEAPF32.byteLength/1048576).toFixed(1) + ' Mo');
  }catch(e){ log('✖ ' + e.message, 'er'); }
};

/* ─────────── Injektè ─────────── */
$('btnInject').onclick = () => {
  try{
    const w = gameEl.contentWindow;
    const r = w.eval($('inject').value);
    log('✔ enjekte' + (r!==undefined ? ' → ' + r : ''), 'ok');
  }catch(e){ log('✖ ' + e.message, 'er'); }
};
$('btnEject').onclick = () => {
  const tag = document.getElementById('aimbot-script');
  if (tag) tag.remove();
  A.eject();
  delete window.__aimbot;
  log('script retire (eject)', 'warn');
  paint();
};
$('btnReload').onclick = () => { location.reload(); };

$('preset').onchange = e => {
  const P = {
    fov:`const c=document.querySelector('canvas');if(!c)throw'pa gen canvas';
const d=document.createElement('div');d.style.cssText='position:fixed;left:50%;top:50%;width:440px;height:440px;transform:translate(-50%,-50%);border:2px solid #22d3ee;border-radius:50%;pointer-events:none;z-index:9';
document.body.appendChild(d);'ok'`,
    scan:`if(!window.Module)throw'Module pa la';
({mb:(Module.HEAPF32.byteLength/1048576).toFixed(1)})`,
    dump:`if(!window.Module)throw'Module pa la';
const s=[];for(let i=0;i<Module.HEAPU8.length;i+=4){const c=Module.HEAPU8[i];
if(c>=32&&c<127){let j=i,k='';while(j<Module.HEAPU8.length&&k.length<40){const d=Module.HEAPU8[j];if(d<32||d>126)break;k+=String.fromCharCode(d);j++}
if(k.length>7)s.push(k);i=j}}s.slice(0,50)`,
    probe:`Object.keys(window).filter(k=>/unity|module|game|instance/i.test(k))`
  };
  if (P[e.target.value]) $('inject').value = P[e.target.value];
};

/* ─────────── Pake done Unity ─────────── */
const td = new TextDecoder();
async function parseUnityData(url){
  const r = await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status);
  const buf = await r.arrayBuffer(), dv = new DataView(buf);
  if (!td.decode(new Uint8Array(buf,0,16)).startsWith('UnityWebData1.0'))
    throw new Error('se pa yon .data Unity');
  const contentStart = dv.getInt32(16, true);
  let p = 20, files = [];
  while (p + 12 <= contentStart){
    const offset = dv.getInt32(p,true); p+=4;
    const size   = dv.getInt32(p,true); p+=4;
    const plen   = dv.getInt32(p,true); p+=4;
    if (plen<=0 || plen>1024) break;
    const path = td.decode(new Uint8Array(buf,p,plen)); p+=plen;
    files.push({path, offset, size});
  }
  return {buf, files};
}
$('btnData').onclick = async () => {
  log('ap analize ' + $('dataUrl').value + '…');
  try{
    pkg = await parseUnityData($('dataUrl').value);
    const box = $('files'); box.innerHTML = '';
    pkg.files.forEach(f => {
      const d = document.createElement('div');
      d.innerHTML = `<span style="flex:1">${f.path}</span>
        <span style="color:#8b949e">${(f.size/1024).toFixed(1)} Ko</span>`;
      d.onclick = () => {
        [...box.children].forEach(c=>c.classList.remove('sel'));
        d.classList.add('sel'); selected = f; log('chwazi: ' + f.path);
      };
      box.appendChild(d);
    });
    log(`✔ ${pkg.files.length} fichye nan pake a`, 'ok');
  }catch(e){ log('✖ ' + e.message, 'er'); }
};
$('btnUse').onclick = () => {
  if (!selected) return log('✖ chwazi yon fichye', 'er');
  const u8 = new Uint8Array(pkg.buf, selected.offset, selected.size);
  let n = 0;
  for (let i=0;i+6<u8.length;i++) if (u8[i]>=32&&u8[i]<127){ n++; }
  A.configure({ package: { path:selected.path, offset:selected.offset, size:selected.size }});
  window.__PKG = { path:selected.path, offset:selected.offset, size:selected.size };
  log(`✔ itilize ${selected.path} (${n} oktè), offset 0x${selected.offset.toString(16)}`, 'ok');
};
$('btnSearch').onclick = () => {
  if (!pkg || !selected) return log('✖ chwazi yon fichye', 'er');
  const q = $('search').value.trim(); if(!q) return;
  const u8 = new Uint8Array(pkg.buf, selected.offset, selected.size);
  const nd = [...q].map(c=>c.charCodeAt(0)), hits = [];
  outer: for (let i=0;i<=u8.length-nd.length;i++){
    for (let k=0;k<nd.length;k++) if (u8[i+k]!==nd[k]) continue outer;
    hits.push('0x'+(selected.offset+i).toString(16));
    if (hits.length>40) break;
  }
  log(hits.length ? `jwenn ${hits.length}: ${hits.join(' ')}` : 'anyen jwenn',
      hits.length?'ok':'er');
};
