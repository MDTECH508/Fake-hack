<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake YT Tech - Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: radial-gradient(circle at top right, #1e1b4b, #09090b); 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 20px; 
            overflow-x: hidden;
        }
        
        /* Animasyon lè paj la ap chaje */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
            to { opacity: 1; transform: translateY(0); filter: blur(0); }
        }

        .container { 
            width: 100%; 
            max-width: 450px; 
            background: rgba(20, 20, 35, 0.65); 
            backdrop-filter: blur(14px) saturate(180%);
            -webkit-backdrop-filter: blur(14px) saturate(180%);
            padding: 30px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.1); 
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1 { 
            background: linear-gradient(45deg, #ff2a85, #a124eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 26px; 
            text-transform: uppercase; 
            margin-bottom: 5px; 
            text-align: center; 
            letter-spacing: 1px;
        }
        .subtitle { color: #94a3b8; font-size: 13px; text-align: center; margin-bottom: 25px; font-weight: 500; }
        
        /* Kat style Glas */
        .card { 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 20px; 
            border-radius: 16px; 
            margin-bottom: 20px; 
            backdrop-filter: blur(5px);
        }
        .card h3 { color: #22d3ee; font-size: 15px; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        label { display: block; color: #94a3b8; font-size: 11px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        select { 
            width: 100%; 
            background: rgba(15, 15, 25, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            color: #fff; 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 15px; 
            outline: none; 
            margin-bottom: 15px; 
            cursor: pointer; 
            transition: 0.3s;
        }
        select:focus { border-color: #a124eb; box-shadow: 0 0 10px rgba(161, 36, 235, 0.2); }
        
        button { 
            width: 100%; 
            background: linear-gradient(135deg, #fa2c84, #a124eb); 
            border: none; 
            color: white; 
            padding: 14px; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 14px; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 4px 20px rgba(250, 44, 132, 0.25); 
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(250, 44, 132, 0.4); filter: brightness(1.1); }
        button:active { transform: translateY(0); }

        .generated-key-box { 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px dashed rgba(161, 36, 235, 0.5); 
            padding: 14px; 
            text-align: center; 
            border-radius: 10px; 
            margin-top: 15px; 
            font-family: 'Courier New', monospace; 
            font-size: 18px; 
            color: #22d3ee; 
            letter-spacing: 2px; 
            display: none; 
            animation: fadeIn 0.4s ease;
        }
        
        .key-item { 
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            padding: 12px 15px; 
            border-radius: 10px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            animation: fadeIn 0.4s ease;
        }
        .key-details div { font-family: monospace; font-size: 14px; margin-bottom: 5px; color: #e2e8f0; }
        
        .status { padding: 3px 8px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .status.aktif { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .status.ekspire { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        
        .delete-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 16px; box-shadow: none; width: auto; padding: 0; transition: 0.2s; }
        .delete-btn:hover { transform: scale(1.1); color: #f87171; }
    </style>
</head>
<body>

<div class="container">
    <h1>Fake YT Tech</h1>
    <div class="subtitle">Panel Jesyon Kle VPN</div>

    <div class="card">
        <h3>⚡ Jenere Kle FAKE</h3>
        <label>Chwazi Durasyon</label>
        <select id="duration">
            <option value="1">1 Jou</option>
            <option value="30">30 Jou</option>
        </select>
        <button onclick="generateKey()">Generate Key</button>
        <div id="keyDisplay" class="generated-key-box"></div>
    </div>

    <div class="card">
        <h3>📋 Lis Kle ki Sove</h3>
        <div id="keyList"></div>
    </div>
</div>

<script>
    function makeRandomCode() {
        const chars = 'ABCDEFGHJKLMNOPQRSTUVWXYZ0123456789';
        let part1 = '', part2 = '';
        for (let i = 0; i < 4; i++) part1 += chars.charAt(Math.floor(Math.random() * chars.length));
        for (let i = 0; i < 4; i++) part2 += chars.charAt(Math.floor(Math.random() * chars.length));
        return `FAKE-${part1}-${part2}`;
    }

    function generateKey() {
        const days = parseInt(document.getElementById('duration').value);
        const newKey = makeRandomCode();
        const expireDate = new Date();
        expireDate.setDate(expireDate.getDate() + days);

        const keyData = { code: newKey, duration: days, expiresAt: expireDate.getTime(), status: 'AKTIF' };
        let keys = JSON.parse(localStorage.getItem('vpn_keys')) || [];
        keys.push(keyData);
        localStorage.setItem('vpn_keys', JSON.stringify(keys));

        const display = document.getElementById('keyDisplay');
        display.innerText = newKey;
        display.style.display = 'block';
        loadKeys();
    }

    function loadKeys() {
        const keyList = document.getElementById('keyList');
        keyList.innerHTML = '';
        let keys = JSON.parse(localStorage.getItem('vpn_keys')) || [];
        const now = new Date().getTime();

        if(keys.length === 0) {
            keyList.innerHTML = '<div style="color:#94a3b8; text-align:center; font-size:13px; padding:10px;">Pa gen kle ki disponib.</div>';
            return;
        }

        keys.forEach((key, index) => {
            let currentStatus = key.status;
            if (now > key.expiresAt) currentStatus = 'EKSPIRE';

            keyList.innerHTML += `
                <div class="key-item">
                    <div class="key-details">
                        <div>${key.code}</div>
                        <span class="status ${currentStatus.toLowerCase()}">${currentStatus}</span>
                        <span style="color:#94a3b8; font-size:11px; margin-left: 8px;">${key.duration} Jou</span>
                    </div>
                    <button class="delete-btn" onclick="deleteKey(${index})">🗑️</button>
                </div>
            `;
        });
    }

    function deleteKey(index) {
        let keys = JSON.parse(localStorage.getItem('vpn_keys')) || [];
        keys.splice(index, 1);
        localStorage.setItem('vpn_keys', JSON.stringify(keys));
        loadKeys();
    }
    window.onload = loadKeys;
</script>
</body>
</html>
